{% extends "base.html" %} {% block title %}Login | DeepFake Analysis{% endblock %} {% block content %}

<section class="py-5 bg-light min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="bi bi-person-circle display-3 text-primary"></i>

                            <h2 class="fw-bold mt-3">
                                Welcome Back
                            </h2>

                            <p class="text-muted">
                                Login to your DeepFake Analysis account
                            </p>

                        </div>

                        <form action="{{ url_for('login') }}" method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>

                            </div>

                            <div class="d-flex justify-content-between mb-4">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="remember">

                                    <label class="form-check-label" for="remember">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="#" class="text-decoration-none">
                                    Forgot Password?
                                </a>

                            </div>

                            <div class="d-grid">

                                <button type="submit" class="btn btn-primary btn-lg">

                                    <i class="bi bi-box-arrow-in-right"></i>

                                    Login

                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <div class="text-center">

                            <p class="mb-0">

                                Don't have an account?

                                <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold">

                                    Register Here

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
